[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-control-agent"
version = "0.1.0"
description = "Quantum control agent for experiment definition and analysis"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.0",
    "langchain>=1.0",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-sqlite",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
